<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Console AI Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="settings">
      <header>
        <h1>Dev Console AI</h1>
        <p>Configure your DeepSeek connection.</p>
      </header>

      <form id="settingsForm">
        <label for="apiKeyInput">DeepSeek API key</label>
        <input id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off" />

        <label for="modelSelect">Model</label>
        <select id="modelSelect">
          <option value="deepseek-chat">deepseek-chat</option>
          <option value="deepseek-reasoner">deepseek-reasoner</option>
        </select>

        <label for="themeSelect">DevTools panel theme</label>
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">Follow system</option>
        </select>

        <button id="saveSettingsBtn" type="submit">Save settings</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="note">Your key is stored locally in Chrome and used by the DevTools panel.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
