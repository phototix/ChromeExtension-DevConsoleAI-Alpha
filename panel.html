<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Console AI</title>
    <link rel="stylesheet" href="devtools.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="history-panel">
        <div class="panel-header">
          <h2>History</h2>
          <button id="newChatBtn" class="secondary-btn" type="button">New Chat</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </aside>

      <main class="chat-panel">
        <section class="context-bar">
          <label for="contextType">Context for your question</label>
          <select id="contextType">
            <option value="none">None</option>
            <option value="dom">DOM</option>
            <option value="console">Console</option>
            <option value="network">Network</option>
            <option value="page">Page metadata</option>
          </select>
          <button id="viewContextBtn" class="secondary-btn" type="button" disabled>View Data</button>
          <button id="clearContextBtn" class="secondary-btn" type="button" hidden>Clear attached data</button>
          <button id="regrabDomBtn" class="secondary-btn" type="button" hidden>Select another DOM element</button>
          <button id="cancelDomPickBtn" class="secondary-btn" type="button" hidden>Cancel selection</button>
          <span id="contextStatus" role="status" aria-live="polite"></span>
        </section>

        <dialog id="contextDialog" class="context-dialog" aria-labelledby="contextDialogTitle">
          <header class="dialog-header">
            <h2 id="contextDialogTitle">Attached data</h2>
            <button id="closeContextDialogBtn" class="secondary-btn" type="button" aria-label="Close">Close</button>
          </header>
          <pre id="contextDialogContent" class="context-dialog-content"></pre>
        </dialog>

        <dialog id="renameDialog" class="context-dialog rename-dialog" aria-labelledby="renameDialogTitle">
          <form id="renameForm" class="rename-form">
            <header class="dialog-header">
              <h2 id="renameDialogTitle">Rename conversation</h2>
            </header>
            <label for="renameTitleInput">Conversation title</label>
            <input id="renameTitleInput" type="text" maxlength="180" required />
            <div class="rename-actions">
              <button id="cancelRenameBtn" class="secondary-btn" type="button">Cancel</button>
              <button type="submit">Save</button>
            </div>
          </form>
        </dialog>

        <dialog id="deleteDialog" class="context-dialog delete-dialog" aria-labelledby="deleteDialogTitle">
          <section class="delete-confirmation">
            <div class="delete-confirm-icon" aria-hidden="true">!</div>
            <h2 id="deleteDialogTitle">Delete conversation?</h2>
            <p id="deleteDialogMessage"></p>
            <div class="delete-confirm-actions">
              <button id="cancelDeleteBtn" class="secondary-btn" type="button">Cancel</button>
              <button id="confirmDeleteBtn" class="delete-confirm-btn" type="button">Delete</button>
            </div>
          </section>
        </dialog>

        <section id="chatMessages" class="messages" aria-live="polite"></section>

        <form id="composer" class="composer">
          <textarea id="promptInput" rows="4" placeholder="Ask a question about the page…"></textarea>
          <div class="composer-actions">
            <button id="sendBtn" type="submit">Send</button>
          </div>
        </form>
      </main>
    </div>

    <script src="devtools.js"></script>
  </body>
</html>
